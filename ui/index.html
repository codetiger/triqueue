<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tri-Queue GEMM — RTL-to-Silicon Pipeline</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- =====================================================================
       TOP APP BAR (MATERIAL 3): TITLE + KPIs + SCENARIOS + TRANSPORT
       ===================================================================== -->
  <header class="cockpit-bar">
    <div class="cockpit-inner">
      <div class="cockpit-row-top">
        <!-- Typographic Title + Inline Hardware Specs -->
        <div class="brand-cluster">
          <div class="brand-text">
            <h1>Tri-Queue GEMM</h1>
          </div>
          <div class="kpi-strip">
            <div class="kpi-pill"><span class="kpi-val cyan">99.2%</span><span class="kpi-lbl">Util</span></div>
            <div class="kpi-pill"><span class="kpi-val emerald">1.98</span><span class="kpi-lbl">TOPS/W</span></div>
            <div class="kpi-pill"><span class="kpi-val violet">12.7k</span><span class="kpi-lbl">µm²</span></div>
            <div class="kpi-pill"><span class="kpi-val">10 B</span><span class="kpi-lbl">Kernel</span></div>
          </div>
        </div>

        <!-- Segmented Scenario Selector -->
        <div class="scenario-tabs" id="scenario-tabs"></div>

        <!-- Master Playback Controls (Inline SVG Icons) -->
        <div class="transport-group">
          <button class="btn-ctrl icon-only" id="btn-reset" title="Reset (Cycle 0)">
            <svg class="ui-icon" viewBox="0 0 16 16"><path d="M3 3h1.8v10H3V3zm2.8 5L13 3v10L5.8 8z"/></svg>
          </button>
          <button class="btn-ctrl icon-only" id="btn-prev" title="Step −1 (←)">
            <svg class="ui-icon" viewBox="0 0 16 16"><path d="M10.8 3L4.8 8l6 5V3z"/></svg>
          </button>
          <button class="btn-ctrl primary" id="btn-play" title="Play / Pause (Space)">
            <svg class="ui-icon" viewBox="0 0 16 16"><path d="M4.5 2.8l8.5 5.2-8.5 5.2V2.8z"/></svg>
            <span>Play</span>
          </button>
          <button class="btn-ctrl icon-only" id="btn-next" title="Step +1 (→)">
            <svg class="ui-icon" viewBox="0 0 16 16"><path d="M5.2 3l6 5-6 5V3z"/></svg>
          </button>
          <button class="btn-ctrl" id="btn-next-beat" title="Next MAC Beat">
            <svg class="ui-icon" viewBox="0 0 16 16"><path d="M9.2 1.5L3.5 9h4.2l-.9 5.5L12.5 7H8.3l.9-5.5z"/></svg>
            <span>Beat</span>
          </button>
          <button class="btn-ctrl" id="btn-next-swap" title="Next Tile Swap">
            <svg class="ui-icon" viewBox="0 0 16 16"><path d="M11.5 2.5L14.5 5.5 11.5 8.5V6.3H5V4.7h6.5V2.5zM4.5 7.5L1.5 10.5 4.5 13.5v-2.2H11V9.7H4.5V7.5z"/></svg>
            <span>Tile</span>
          </button>
          <div class="cycle-readout" id="cycle-readout">CYC 0 / 161</div>
          <select id="speed-select" class="btn-ctrl" title="Playback Speed">
            <option value="450">0.5×</option>
            <option value="220" selected>1×</option>
            <option value="95">2.5×</option>
            <option value="35">6×</option>
          </select>
        </div>
      </div>
    </div>
  </header>

  <!-- =====================================================================
       MAIN WIDESCREEN WORKSPACE
       Row 1: Logical RTL (`tq_top`) + 3D Silicon Die (`6_final.def`)
       Row 2: Cycle Dataflow (Decoder / Queues / 8x8 MAC & Timeline)
       ===================================================================== -->
  <main class="main-workspace" id="main-workspace">

    <!-- ===================================================================
         ROW 1, LEFT: LOGICAL RTL ARCHITECTURE
         =================================================================== -->
    <section class="showcase-section" id="section-logical">
      <div class="section-header">
        <div class="section-title-group">
          <svg class="sec-icon" viewBox="0 0 16 16"><path d="M2 2h5v5H2V2zm7 0h5v5H9V2zM2 9h5v5H2V9zm7 2.5h2V9h1.5v2.5H15V13h-2.5v2H11v-2H9v-1.5z"/></svg>
          <h2>Logical RTL · <code>tq_top</code></h2>
        </div>
      </div>

      <div class="logical-stage-full">
        <div class="logical-svg-wrap" id="logical-svg-container"></div>
        <div class="rtl-popover-card hidden" id="rtl-inspector-panel"></div>
      </div>
    </section>

    <!-- ===================================================================
         ROW 1, RIGHT: 3D SILICON DIE (`6_final.def`)
         =================================================================== -->
    <section class="showcase-section" id="section-chip3d">
      <div class="section-header">
        <div class="section-title-group">
          <svg class="sec-icon" viewBox="0 0 16 16"><path d="M8 1.5L1.5 5 8 8.5 14.5 5 8 1.5zM1.5 8L8 11.5 14.5 8M1.5 11L8 14.5 14.5 11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <h2>Silicon Die · <code>6_final.def</code></h2>
        </div>
        <div class="section-controls">
          <button class="pill-btn active" id="pdk-asap7">ASAP7 7nm</button>
          <button class="pill-btn" id="pdk-sky130">Sky130 130nm</button>
        </div>
      </div>

      <div class="chip3d-layout">
        <!-- Compact Control Strip -->
        <div class="chip3d-sidebar">
          <div class="lens-grid" id="color-lens-buttons">
            <button class="pill-btn active" data-lens="module">
              <svg class="ui-icon" viewBox="0 0 16 16"><path d="M2 2h5v5H2V2zm7 0h5v5H9V2zM2 9h5v5H2V9zm7 0h5v5H9V9z"/></svg>
              <span>Modules</span>
            </button>
            <button class="pill-btn" data-lens="material">
              <svg class="ui-icon" viewBox="0 0 16 16"><path d="M8 2L2 5.2 8 8.4l6-3.2L8 2zm-6 6l6 3.2 6-3.2M2 11l6 3.2 6-3.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
              <span>Metals</span>
            </button>
            <button class="pill-btn" data-lens="cell_class">
              <svg class="ui-icon" viewBox="0 0 16 16"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6 1.5v2M10 1.5v2M6 12.5v2M10 12.5v2M1.5 6h2M1.5 10h2M12.5 6h2M12.5 10h2" stroke="currentColor" stroke-width="1.3"/></svg>
              <span>Cells</span>
            </button>
            <button class="pill-btn" data-lens="activity">
              <svg class="ui-icon" viewBox="0 0 16 16"><path d="M1.5 8.5h3l2-5.5 3 10 2-4.5h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>Activity</span>
            </button>
            <button class="pill-btn" data-lens="clock_xray">
              <svg class="ui-icon" viewBox="0 0 16 16"><circle cx="8" cy="8" r="5.8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 4.8V8l2.5 1.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              <span>Clock</span>
            </button>
          </div>

          <div class="explode-box">
            <div class="explode-row">
              <span>Z-Scale</span>
              <span id="explode-val-label" style="color: var(--cyan-qa);">2.8×</span>
            </div>
            <input type="range" id="explode-slider" min="0.4" max="9.5" step="0.2" value="2.8" />
          </div>

          <div class="layer-pill-grid" id="layer-stack-toggles"></div>

          <div class="module-legend-list" id="module-flyto-list"></div>
        </div>

        <!-- Interactive WebGL 2.0 3D Viewport -->
        <div class="chip3d-viewport">
          <canvas id="chip3d-canvas"></canvas>

          <div class="viewport-hud-top">
            <div class="hud-badge" id="chip3d-hud-info">ASAP7 7nm · 161×161 µm</div>
            <div class="hud-badge" id="chip3d-hover-readout"></div>
          </div>

          <div class="viewport-hud-bottom">
            <div class="camera-bar">
              <button class="btn-ctrl" data-cam="iso">
                <svg class="ui-icon" viewBox="0 0 16 16"><path d="M8 1.8l5.5 3.1v6.2L8 14.2 2.5 11.1V4.9L8 1.8z" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
                <span>Iso</span>
              </button>
              <button class="btn-ctrl" data-cam="top">
                <svg class="ui-icon" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>
                <span>Top</span>
              </button>
              <button class="btn-ctrl" data-cam="side">
                <svg class="ui-icon" viewBox="0 0 16 16"><path d="M2 4.5h12M2 8h12M2 11.5h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
                <span>Side</span>
              </button>
              <button class="btn-ctrl" id="btn-clear-isolate">
                <svg class="ui-icon" viewBox="0 0 16 16"><path d="M8 3a5 5 0 1 0 4.5 2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M12.5 2v3.8H8.7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>Reset</span>
              </button>
            </div>
            <canvas id="chip3d-compass" width="64" height="64" title="Orientation: N (+Y), E (+X), Z (Stack)"></canvas>
          </div>
        </div>
      </div>
    </section>

    <!-- ===================================================================
         ROW 2, FULL WIDTH: CYCLE DATAFLOW & QUEUE STATE
         =================================================================== -->
    <section class="showcase-section" id="section-howitworks">
      <div class="section-header">
        <div class="section-title-group">
          <svg class="sec-icon" viewBox="0 0 16 16"><path d="M2 3.5h12M2 8h8M2 12.5h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <h2>Cycle Dataflow</h2>
        </div>
        <div class="section-controls" id="hiw-stats-pills"></div>
      </div>

      <div class="howitworks-body">
        <div class="hiw-columns">

          <!-- COLUMN 1: Decoder, Tile Grid & Stream Walkers -->
          <div class="hiw-card">
            <div class="hiw-card-hdr">
              <h3>
                <svg class="ui-icon" viewBox="0 0 16 16"><path d="M3 2.5h10v11H3v-11zm2.5 3h5m-5 2.5h5m-5 2.5h3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                Decoder
              </h3>
              <span class="sub-tag" id="fe-pc-badge">PC 0x00</span>
            </div>

            <div class="opcode-track" id="kernel-track"></div>
            <div class="tile-loop-visual" id="fe-loop-boxes"></div>

            <div class="hiw-card-hdr" style="margin-top: 2px;">
              <h3>
                <svg class="ui-icon" viewBox="0 0 16 16"><path d="M2 5.5h9.5l-2-2M14 10.5H4.5l2 2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Streams
              </h3>
            </div>
            <div id="stream-walkers-box"></div>
          </div>

          <!-- COLUMN 2: Tri-Queue Slots (QA, QB, MAC CmdQ) -->
          <div class="hiw-card">
            <div class="hiw-card-hdr">
              <h3>
                <svg class="ui-icon" viewBox="0 0 16 16"><rect x="2.5" y="2.5" width="11" height="3" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="6.5" width="11" height="3" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.3"/><rect x="2.5" y="10.5" width="11" height="3" rx="0.8" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
                Queues
              </h3>
            </div>

            <div class="queue-block qa-theme" id="qa-queue-box"></div>
            <div class="queue-block qb-theme" id="qb-queue-box"></div>
            <div class="queue-block macq-theme" id="macq-queue-box"></div>
          </div>

          <!-- COLUMN 3: 8x8 Outer-Product Matrix & Ping-Pong Banks -->
          <div class="hiw-card">
            <div class="hiw-card-hdr">
              <h3>
                <svg class="ui-icon" viewBox="0 0 16 16"><path d="M2.5 2.5h4.5v4.5H2.5V2.5zm6.5 0h4.5v4.5H9V2.5zM2.5 9h4.5v4.5H2.5V9zm6.5 0h4.5v4.5H9V9z" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
                8×8 MAC &amp; Banks
              </h3>
              <div style="display:flex; gap:5px; align-items:center;">
                <span class="sub-tag" id="arity-badge"></span>
                <span class="sub-tag" id="beat-status-badge">Idle</span>
              </div>
            </div>

            <div class="outer-prod-stage">
              <div id="outer-product-grid-container"></div>
              <div class="banks-dual-grid" id="banks-dual-container"></div>
            </div>
          </div>

        </div>

        <!-- BOTTOM: Draggable 3-Way Overlap Timeline -->
        <div class="waterfall-box">
          <div class="waterfall-hdr">
            <div class="wf-title">
              <svg class="ui-icon" viewBox="0 0 16 16"><path d="M2 4h5v2H2V4zm4 3.5h6v2H6v-2zM4 11h8v2H4v-2z"/></svg>
              <span>Timeline</span>
            </div>
            <div class="wf-legend">
              <span><i style="background: var(--yellow-fe);"></i>Decode</span>
              <span><i style="background: var(--cyan-qa);"></i>Read A</span>
              <span><i style="background: var(--amber-qb);"></i>Read B</span>
              <span><i style="background: var(--lime-cg);"></i>Panel</span>
              <span><i style="background: var(--emerald-bx);"></i>Bank X</span>
              <span><i style="background: var(--coral-by);"></i>Bank Y</span>
              <span><i style="background: #f6aea9;"></i>Drain</span>
            </div>
          </div>
          <div class="waterfall-canvas-wrap">
            <canvas id="waterfall-canvas" width="1400" height="142"></canvas>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Data & Application Scripts -->
  <script src="data/traces_data.js"></script>
  <script src="data/chip_asap7.js"></script>
  <script src="data/chip_sky130hd.js"></script>
  <script src="chip3d.js"></script>
  <script src="app.js"></script>
</body>
</html>
