name: nightly

# Long-running checks kept out of the per-push CI: the shared-port core proof (1-80 min, varies widely).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  formal-shared:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
      - run: make formal-nightly
