#
# Longer formal proofs (`make formal-nightly`):
#   - tq_core.sby shared:    unbounded core proof on a shared memory port
#   - tq_core.sby ack:       unbounded core proof with WR_ACK = 1 (shared port)
#   - tq_core.sby ack_split: unbounded core proof with WR_ACK = 1 (split port)
#   - tq_core.sby panel:     unbounded core proof with PANEL_BYTES = 32
#   - tq_axi_mem.sby prove:       unbounded AXI4 master proof (BURST_BEATS = 1)
#   - tq_axi_mem.sby burst_prove: unbounded AXI4 master proof (BURST_BEATS = 2)
# Each proof runs in its own matrix job with `fail-fast: false` so every proof's verdict is visible.

name: Nightly formal

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-nightly:
    name: Formal proof (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        task:
          - "tq_core.sby shared"
          - "tq_core.sby ack"
          - "tq_core.sby ack_split"
          - "tq_core.sby panel"
          - "tq_axi_mem.sby prove"
          - "tq_axi_mem.sby burst_prove"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: YosysHQ/setup-oss-cad-suite@c2fa6abeb5c4d6de7466725ba615f11b20a18477 # v4.0.0
        with:
          version: "2026-11-01"
      - name: Run SymbiYosys proof (${{ matrix.task }})
        working-directory: verif/formal
        run: sby -f ${{ matrix.task }}
