#
# Longer formal proofs (`make formal-nightly`):
#   - tq_mac_array.sby csa1: lazy accumulator clear, carry-save with MAC_PIPE = 1
#   - tq_core.sby shared:    unbounded core proof on a shared memory port
#   - tq_core.sby ack:       unbounded core proof with WR_ACK = 1 (shared port)
#   - tq_core.sby ack_split: unbounded core proof with WR_ACK = 1 (split port)
#   - tq_core.sby panel:     unbounded core proof with PANEL_BYTES = 32
#   - tq_axi_mem.sby burst_data: unbounded AXI4 master burst proof with read data, MAX_OUT = 1
# The other AXI4 master proofs (tq_axi_mem.sby prove / burst_prove / burst) take seconds and run on
# every push in `make formal` (ci.yml).
# Each proof runs in its own matrix job with `fail-fast: false` so every proof's verdict is visible.
# rtl-coverage reruns the cocotb regression with Verilator line + toggle coverage (`make rtl-coverage`)
# and publishes the per-file summary and lcov data as an artifact.

name: Nightly formal

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formal-nightly:
    name: Formal proof (${{ matrix.task }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        task:
          - "tq_mac_array.sby csa1"
          - "tq_core.sby shared"
          - "tq_core.sby ack"
          - "tq_core.sby ack_split"
          - "tq_core.sby panel"
          - "tq_axi_mem.sby burst_data"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4
        with:
          version: "2026-11-11"  # last build the full rtl job passed on
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run SymbiYosys proof (${{ matrix.task }})
        working-directory: verif/formal
        run: sby -f ${{ matrix.task }}

  rtl-coverage:
    name: RTL regression with Verilator line + toggle coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4
        with:
          version: "2026-11-11"  # last build the full rtl job passed on
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install -r requirements.txt
      - name: Regression with coverage, merged per source file
        run: make rtl-coverage && cat build/rtl-cov/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report (summary, lcov, annotated sources)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rtl-coverage
          path: |
            build/rtl-cov/summary.md
            build/rtl-cov/coverage.info
            build/rtl-cov/annotated/
          if-no-files-found: warn
