#
# Publishes a GitHub Release with the source tarball, golden-vector tarball, and SHA-256 sums
# when a v* tag is pushed. First runs the full verification suite under read-only permissions,
# then publishes the artifacts in a separate write-scoped job.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release & build artifacts (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: YosysHQ/setup-oss-cad-suite@c2fa6abeb5c4d6de7466725ba615f11b20a18477 # v4.0.0
        with:
          version: "2026-11-01"
      - run: pip install -r requirements.txt
      - name: Full verification gate (model, sw, spdx, version, lock, lint, synth, formal, rtl)
        run: make all
      - name: Build reproducible release archives
        run: make dist VERSION="${GITHUB_REF_NAME#v}"
      - name: Upload release archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release (${{ github.ref_name }})
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
