#
# Publishes a GitHub Release with the source tarball, golden-vector tarball, and SHA-256 sums
# when a v* tag is pushed. First runs the full verification suite under read-only permissions,
# then publishes the artifacts in a separate write-scoped job.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify release & build artifacts (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4
        with:
          version: "2026-11-11"  # last build the full rtl job passed on
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install -r requirements.txt
      - name: Full verification gate (model, sw, spdx, version, lock, lint, synth, formal, rtl)
        run: make all
      - name: Build reproducible release archives
        run: make dist VERSION="${GITHUB_REF_NAME#v}"
      - name: Upload release archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release (${{ github.ref_name }})
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
