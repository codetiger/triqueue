name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install the model package
        run: pip install -e . --no-deps
      - name: Bit-exact and structural tests
        working-directory: model
        run: python -m pytest -q
      - name: C driver against the model
        run: python -m pytest sw -q

  spdx:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SPDX headers
        run: python tools/check_spdx.py

  model-results-up-to-date:
    # Regenerates model/results.md, model/dse.md and flow/results.md (from the committed run
    # records) and fails if a committed copy is stale.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Regenerate cycle-model results
        working-directory: model
        run: |
          python bench.py > /dev/null
          python dse.py > /dev/null
      - name: Regenerate physical design results and UI scenario bundles
        run: |
          python flow/results.py > /dev/null
          python ui/pipeline/build_ui_data.py > /dev/null
      - name: Check committed results and UI bundles match
        run: git diff --exit-code -- model/results.md model/dse.md flow/results.md ui/data/
      - name: Verify cryptographic silicon layout and utilization lock
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            python flow/check_lock.py --check-git-base "origin/${{ github.base_ref }}"
          else
            python flow/check_lock.py
          fi

  rtl:
    # Lint (Verilator + Yosys), RTL-vs-model regression (cocotb + Verilator), formal (SymbiYosys),
    # and a generic synthesizability check.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: YosysHQ/setup-oss-cad-suite@v3
      - run: pip install -r requirements.txt
      - run: make rtl-lint
      - run: make rtl-test
      - run: make formal
      - run: make synth-check
