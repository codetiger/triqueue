name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  model-test:
    name: Model + C driver tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pytest suite (model)
        working-directory: model
        run: python -m pytest -q
      - name: Pytest suite (sw C driver against the model, no skips allowed)
        run: python -m pytest sw -q -rs -W error::pytest.PytestWarning
      - name: Golden-vector generator smoke check
        working-directory: model
        run: |
          python -m tri_queue.vectors --m 16 --n 16 --k 16 -o /tmp/vec_8
          python -m tri_queue.vectors --m 20 --n 9 --k 33 --tile 16 --a u8 -o /tmp/vec_16

  spdx-check:
    name: SPDX license headers & version check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: |
          python tools/check_spdx.py
          python tools/check_version.py

  model-results-up-to-date:
    name: Generated results & layout lock match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify silicon layout lock (floorplan, PPA records, 3D UI bundles)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python flow/check_lock.py --check-git-base "origin/${{ github.base_ref }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            python flow/check_lock.py --check-git-base "${{ github.event.before }}"
          else
            python flow/check_lock.py
          fi
      - name: Regenerate model/results.md, model/dse.md, bench/reference/amx/*.md, flow/results.md, and ui/data/traces_data.js
        run: |
          cd model && python bench.py > /dev/null && python dse.py > /dev/null
          cd ../bench/reference/amx && python compare.py > /dev/null && python ablation.py > /dev/null
          cd ../../..
          python flow/results.py > /dev/null
          python ui/pipeline/build_ui_data.py
      - name: Check committed files are up to date
        run: git diff --exit-code model/results.md model/dse.md bench/reference/amx/results.md bench/reference/amx/ablation.md flow/results.md ui/data/traces_data.js

  rtl:
    name: RTL lint, cocotb regression, formal, synth-check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: YosysHQ/setup-oss-cad-suite@c7845bc0d335c8076aa22047e85972caa8a916df # v4
        with:
          version: "2026-11-11"  # last build the full rtl job passed on
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: pip install -r requirements.txt
      - name: Verilator -Wall + Yosys elaboration
        run: make rtl-lint
      - name: Synthesis check (no latches, loops or undriven nets)
        run: make synth-check
      - name: Formal proofs (FIFO + core, split port)
        run: make formal
      - name: cocotb regression against the model
        run: make rtl-test
