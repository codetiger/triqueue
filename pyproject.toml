[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "tri-queue"
version = "1.0.0"
description = "Cycle-level model and host tooling for the Tri-Queue int8 matrix coprocessor"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Harishankar Narayanan", email = "nharishankar@gmail.com" }]
keywords = ["matrix-multiply", "GEMM", "RISC-V", "accelerator", "int8"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["numpy>=2.5"]

[project.optional-dependencies]
test = ["pytest>=9.2", "cocotb>=2.1"]

[project.urls]
Homepage = "https://github.com/codetiger/triqueue"
Issues = "https://github.com/codetiger/triqueue/issues"

[tool.setuptools]
package-dir = { "" = "model" }
packages = ["tri_queue"]
